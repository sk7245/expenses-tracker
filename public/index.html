<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
</head>

<body>
    <div class="container">

        <header class="topbar">
            <div>
                <h1>Expenses Tracker</h1>
                <p class="tagline">Know where every rupee goes</p>
            </div>
            <div class="user-box">
                <span id="user-name"></span>
                <button type="button" id="logout-btn" class="link-btn">Log out</button>
            </div>
        </header>

        <!-- shown once if the old version left data in this browser -->
        <div id="import-banner" class="banner" hidden>
            <p id="import-text"></p>
            <div class="banner-actions">
                <button type="button" id="import-btn" class="small-btn">Import</button>
                <button type="button" id="import-dismiss" class="link-btn">Not now</button>
            </div>
        </div>

        <!-- balance for the selected month -->
        <section class="balance-card">
            <p>Balance · <span id="current-month"></span></p>
            <h2 id="balance">₹0</h2>
        </section>

        <section class="summary">
            <div class="summary-box">
                <p>Income</p>
                <p id="total-income" class="money income-text">₹0</p>
            </div>
            <div class="summary-box">
                <p>Spent</p>
                <p id="total-expense" class="money expense-text">₹0</p>
            </div>
        </section>

        <!-- ask questions in plain English (AI) -->
        <section id="ask-section" class="ask-card" hidden>
            <h3>Ask about your money</h3>
            <form id="ask-form" class="ask-form">
                <input type="text" id="ask-input" placeholder="e.g. How much did I spend on food last month?" maxlength="300">
                <button type="submit" id="ask-btn" class="small-btn">Ask</button>
            </form>
            <div class="chips">
                <button type="button" class="chip">How much did I spend this month?</button>
                <button type="button" class="chip">What was my biggest expense last month?</button>
                <button type="button" class="chip">How much have I spent on Swiggy and Zomato?</button>
            </div>
            <div id="ask-result" class="ask-result" hidden>
                <p id="ask-answer"></p>
                <p id="ask-meta" class="meta"></p>
                <ul id="ask-list" class="ask-list"></ul>
            </div>
        </section>

        <!-- where the money went this month -->
        <section id="breakdown-section" hidden>
            <h3>Where it went</h3>
            <div id="breakdown" class="bars"></div>
        </section>

        <!-- add / edit transaction form -->
        <section>
            <div class="section-header">
                <h3 id="form-title">Add transaction</h3>
                <button type="button" id="scan-btn" class="small-btn outline" hidden>Scan a bill</button>
                <input type="file" id="scan-input" accept="image/*" hidden>
            </div>
            <p id="scan-status" class="hint" hidden></p>

            <form id="transaction-form">

                <!-- expense or income toggle -->
                <div class="type-toggle">
                    <input type="radio" name="type" id="type-expense" value="expense" checked>
                    <label for="type-expense">Expense</label>
                    <input type="radio" name="type" id="type-income" value="income">
                    <label for="type-income">Income</label>
                </div>

                <label for="description">Description</label>
                <input type="text" id="description" placeholder="e.g. Swiggy order, Rent, Salary" maxlength="60" autocomplete="off">

                <div class="row">
                    <div>
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" placeholder="0" min="0.01" step="0.01">
                    </div>
                    <div>
                        <label for="date">Date</label>
                        <input type="date" id="date">
                    </div>
                </div>

                <div class="row">
                    <div>
                        <label for="category">Category</label>
                        <select id="category">
                            <optgroup label="Expense" id="expense-categories">
                                <option value="Food & Dining">Food & Dining</option>
                                <option value="Groceries">Groceries</option>
                                <option value="Transport">Transport</option>
                                <option value="Fuel">Fuel</option>
                                <option value="Rent">Rent</option>
                                <option value="Bills & Recharge">Bills & Recharge</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Health">Health</option>
                                <option value="Education">Education</option>
                                <option value="EMI & Loans">EMI & Loans</option>
                                <option value="Other Expense">Other</option>
                            </optgroup>
                            <optgroup label="Income" id="income-categories">
                                <option value="Salary">Salary</option>
                                <option value="Freelance">Freelance</option>
                                <option value="Business">Business</option>
                                <option value="Interest & Returns">Interest & Returns</option>
                                <option value="Gift">Gift</option>
                                <option value="Other Income">Other</option>
                            </optgroup>
                        </select>
                        <p id="category-hint" class="hint" hidden></p>
                    </div>
                    <div>
                        <label for="payment-mode" id="payment-label">Paid via</label>
                        <select id="payment-mode">
                            <option value="UPI">UPI</option>
                            <option value="Cash">Cash</option>
                            <option value="Debit Card">Debit Card</option>
                            <option value="Credit Card">Credit Card</option>
                            <option value="Net Banking">Net Banking</option>
                        </select>
                    </div>
                </div>

                <p id="form-error" class="form-error" hidden></p>

                <div class="form-buttons">
                    <button type="submit" id="add-btn" class="add-btn">Add Transaction</button>
                    <button type="button" id="cancel-edit" class="cancel-btn" hidden>Cancel</button>
                </div>
            </form>
        </section>

        <!-- history -->
        <section>
            <div class="section-header">
                <h3>History</h3>
                <div class="filters">
                    <input type="month" id="filter-month" class="filter">
                    <select id="filter-category" class="filter">
                        <option value="All">All categories</option>
                        <optgroup label="Expense">
                            <option value="Food & Dining">Food & Dining</option>
                            <option value="Groceries">Groceries</option>
                            <option value="Transport">Transport</option>
                            <option value="Fuel">Fuel</option>
                            <option value="Rent">Rent</option>
                            <option value="Bills & Recharge">Bills & Recharge</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Health">Health</option>
                            <option value="Education">Education</option>
                            <option value="EMI & Loans">EMI & Loans</option>
                            <option value="Other Expense">Other</option>
                        </optgroup>
                        <optgroup label="Income">
                            <option value="Salary">Salary</option>
                            <option value="Freelance">Freelance</option>
                            <option value="Business">Business</option>
                            <option value="Interest & Returns">Interest & Returns</option>
                            <option value="Gift">Gift</option>
                            <option value="Other Income">Other</option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <!-- javascript fills this list -->
            <ul id="transaction-list"></ul>

            <p id="empty-message" class="empty-message" hidden>Nothing here yet. Add your first transaction above.</p>
        </section>

    </div>
</body>

</html>
