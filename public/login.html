<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in · Expenses Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="login.js"></script>
</head>

<body>
    <div class="container auth-card">

        <header>
            <h1>Expenses Tracker</h1>
            <p class="tagline">Know where every rupee goes</p>
        </header>

        <!-- log in / sign up switch -->
        <div class="type-toggle">
            <input type="radio" name="mode" id="mode-login" value="login" checked>
            <label for="mode-login">Log in</label>
            <input type="radio" name="mode" id="mode-register" value="register">
            <label for="mode-register">Sign up</label>
        </div>

        <form id="auth-form">
            <div id="name-field" hidden>
                <label for="name">Your name</label>
                <input type="text" id="name" autocomplete="name" maxlength="50">
            </div>

            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password" minlength="8" required>
            <p id="password-help" class="hint" hidden>At least 8 characters.</p>

            <p id="auth-error" class="form-error" hidden></p>

            <button type="submit" id="auth-btn" class="add-btn">Log in</button>
        </form>

    </div>
</body>

</html>
